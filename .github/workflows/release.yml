name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Match tag and Cargo version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version $tag_version does not match Cargo package version $package_version" >&2
            exit 1
          fi

  windows-release:
    name: Build Windows x86_64
    needs: verify-version
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Use stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $assetName = "coding-pet-${{ github.ref_name }}-windows-x86_64.exe"
          $assetPath = Join-Path dist $assetName
          Copy-Item target\release\coding-pet.exe $assetPath
          $hash = (Get-FileHash -Algorithm SHA256 $assetPath).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content -Encoding ascii (Join-Path dist "$assetName.sha256")

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: coding-pet-${{ github.ref_name }}-windows-x86_64
          path: dist/*
          if-no-files-found: error

  macos-release:
    name: Build macOS universal
    needs: verify-version
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Use stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Test
        run: cargo test --locked

      - name: Build both architectures
        shell: bash
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Package app bundle
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          app="dist/CodingPet.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create \
            target/aarch64-apple-darwin/release/coding-pet \
            target/x86_64-apple-darwin/release/coding-pet \
            -output "$app/Contents/MacOS/coding-pet"
          sed "s/__VERSION__/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"

          iconset="$RUNNER_TEMP/CodingPet.iconset"
          mkdir -p "$iconset"
          sips -z 16 16 icon.png --out "$iconset/icon_16x16.png" >/dev/null
          sips -z 32 32 icon.png --out "$iconset/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 icon.png --out "$iconset/icon_32x32.png" >/dev/null
          sips -z 64 64 icon.png --out "$iconset/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 icon.png --out "$iconset/icon_128x128.png" >/dev/null
          sips -z 256 256 icon.png --out "$iconset/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 icon.png --out "$iconset/icon_256x256.png" >/dev/null
          sips -z 512 512 icon.png --out "$iconset/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 icon.png --out "$iconset/icon_512x512.png" >/dev/null
          sips -z 1024 1024 icon.png --out "$iconset/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/CodingPet.icns"
          codesign --force --deep --sign - "$app"

          asset_name="coding-pet-${GITHUB_REF_NAME}-macos-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/$asset_name"
          shasum -a 256 "dist/$asset_name" | sed 's#  dist/#  #' > "dist/$asset_name.sha256"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: coding-pet-${{ github.ref_name }}-macos-universal
          path: dist/*.zip*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - windows-release
      - macos-release
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coding-pet-${{ github.ref_name }}-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "CodingPet $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
