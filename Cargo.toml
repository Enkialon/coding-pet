[package]
name = "coding-pet"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"

[dependencies]
winit = "0.30"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_Globalization",
    "Win32_UI_Shell",
    "Win32_Security_Cryptography",
] }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
tray-icon = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
