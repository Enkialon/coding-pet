[package]
name = "coding-pet"
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"

[dependencies]
winit = "0.30"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
tray-icon = "0.24"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
egui = "0.32"
egui-wgpu = "0.32"
pollster = "1.0.1"
egui-winit = { version = "0.32", default-features = false, features = ["clipboard"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Globalization",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSView", "NSWindow"] }
pixels = "0.17"
sys-locale = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
